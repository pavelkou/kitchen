<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kitchen 3D — Ceramic Preview</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1b1d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
  #app canvas{display:block;touch-action:none;outline:none}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b1b1d;z-index:20;transition:opacity .6s}
  #load.hide{opacity:0;pointer-events:none}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff33;border-top-color:#fff;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loadtxt{font-size:14px;opacity:.85;max-width:80vw;text-align:center}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));font-size:13px;padding:7px 11px;border-radius:10px;background:rgba(20,20,22,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #hud span{opacity:.7;margin-left:6px}
  #map{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:160px;height:160px;border-radius:10px;background:rgba(20,20,22,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  @media (max-width:560px){#hint{display:none}#map{width:118px;height:118px}}
  #panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(560px,calc(100vw - 16px));box-sizing:border-box;padding:8px;border-radius:16px;background:rgba(20,20,22,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:7px}
  .row{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
  button{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:10px;min-width:42px;height:38px;padding:0 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  button:active,button.on{background:rgba(255,255,255,.32)}
  .views button{height:32px;font-size:13px}
  label{font-size:12px;opacity:.8;min-width:62px}
  input[type=range]{flex:1;accent-color:#fff}
  #vrexit,#vrline,#vrrot{display:none}
  body.vr #panel,body.vr #hud,body.vr #map{display:none}
  body.vr #vrline{display:block;position:fixed;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#000;pointer-events:none}
  body.vr #vrexit{display:block;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:5;opacity:.85;transition:opacity .5s;background:rgba(20,20,22,.7)}
  body.vr #vrexit.fade{opacity:0}
  @media (orientation:portrait){body.vr #vrrot{display:flex;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.75);font-size:18px;z-index:4;pointer-events:none}}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:70vw;padding:12px 16px;border-radius:12px;background:rgba(20,20,22,.85);font-size:14px;text-align:center;z-index:6;opacity:0;pointer-events:none;transition:opacity .4s}
  #toast.show{opacity:1}
  #settings{display:none;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12);padding-top:7px}
  #settings.open{display:flex}
  .chk{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .chk label{min-width:0;opacity:1;font-size:13px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);padding:6px 9px;border-radius:9px}
  select{font:inherit;font-size:13px;background:#333;color:#fff;border:1px solid #555;border-radius:8px;padding:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="load"><div class="spin"></div><div id="loadtxt">Building your kitchen…</div></div>
<div id="hud"><b>Kitchen</b> · ceramic preview<span id="hint">drag to look · pinch / scroll to zoom</span></div>

<div id="vrline"></div><button id="vrexit">✕ Exit VR</button><div id="vrrot">Turn the phone sideways (landscape)</div><div id="toast"></div>
<canvas id="map" width="300" height="300" title="Floor plan"></canvas>
<div id="panel">
  <div class="row views">
    <button data-view="s0">Espresso</button>
    <button data-view="s1">Sink</button>
    <button data-view="s2">Fridge</button>
    <button data-view="s3">Entrance</button>
    <button data-view="s4">Chair</button>
    <button data-view="s5">Sofa</button>
    <button data-view="s6">Dining</button>
    <button data-view="s7">Balcony</button>
    <button data-view="s8">Island</button>
  </div>
  <div class="row">
    <button id="bl" title="Turn left">◀</button>
    <button id="bu" title="Look up">▲</button>
    <button id="bd" title="Look down">▼</button>
    <button id="bfw" title="Walk forward">⇧ Walk</button>
    <button id="bbk" title="Walk back">⇩</button>
    <button id="br" title="Turn right">▶</button>
    <button id="bvr" title="VR headset mode">🥽 VR</button>
    <button id="bgear" title="Settings">⚙</button>
  </div>
  <div id="settings">
    <div class="row"><label>Exposure</label><input type="range" id="exp" min="0.4" max="2.2" step="0.01" value="1"></div>
    <div class="row"><label>Lens (FOV)</label><input type="range" id="fov" min="30" max="95" step="1" value="70"></div>
    <div class="chk">
      <label><input type="checkbox" id="cSpots" checked>Ceiling lights</label>
      <label><input type="checkbox" id="cLed" checked>LED strip</label>
      <label><input type="checkbox" id="cSun" checked>Sunlight</label>
      <label><input type="checkbox" id="cAO" checked>Soft shadows (AO)</label>
    </div>
    <div class="row"><label>Island aisle side</label>
      <select id="islSide"><option value="cab">White drawers</option><option value="cer">Ceramic panel</option></select>
    </div>
  </div>
</div>

<script>
  window.addEventListener('error', function (e) {
    var t = document.getElementById('loadtxt');
    if (t) { t.textContent = 'Error: ' + (e.message || e); document.getElementById('load').classList.remove('hide'); }
  });
  setTimeout(function () { if (!window.__ok) { document.getElementById('loadtxt').textContent = 'Could not load the 3D engine (three.js). Check your connection and reload.'; } }, 15000);
</script>

  [737.4, 406.64, 791.16, 412.4, [[742.0, 789.0, 0, 2.1, 'door+']]],        // bedroom 1 door
  [796.92, 323.12, 908.4, 328.88],                                           // en-suite top
  [789.24, 323.12, 796.92, 466.16, [[332, 375, 0, 2.1, 'door-']]],          // en-suite door wall

const PARAPETS = [[147.48, 69.2, 351.96, 77.36], [147.48, 77.36, 155.64, 212.72], [233.4, 828.08, 357.72, 833.84], [233.4, 748.88, 238.68, 828.08]];

const ROOM_LIGHTS = [[550, 420], [265, 310], [265, 475], [265, 650], [440, 735], [830, 230]];

/* ---------------- procedural textures ---------------- */
function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function toTex(c, srgb = true) {

  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  return t;
}
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

// Polished white ceramic slab with soft grey + warm beige/gold veins (seamlessly tiling)
function makeMarble(seed) {
  const W = 2048, H = 1024; const [c, g] = canvas(W, H); const R = rng(seed);
  g.fillStyle = '#f4f3ef'; g.fillRect(0, 0, W, H);
  const offs = [[-W, -H], [0, -H], [W, -H], [-W, 0], [0, 0], [W, 0], [-W, H], [0, H], [W, H]];
  const wrapDraw = (ox, oy, fn) => { for (const [a, b] of offs) { g.save(); g.translate(a - ox, b - oy); fn(); g.restore(); } };
  // soft cloudy body
  for (let i = 0; i < 110; i++) {
    const x = R() * W, y = R() * H, r = 120 + R() * 520, a = 0.03 + R() * 0.06;
    const col = R() < 0.55 ? '220,213,201' : (R() < 0.5 ? '255,255,255' : '206,206,204');
    wrapDraw(0, 0, () => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); });
  }
  const veins = [];
  function trace(x, y, ang, len, w, col, str, depth) {
    const pts = []; let a = ang; const ph = R() * 10;
    for (let i = 0; i < len; i += 5) {
      a += (R() - 0.5) * 0.18 + Math.sin(i * 0.006 + ph) * 0.012;
      x += Math.cos(a) * 5; y += Math.sin(a) * 5;
      pts.push([x, y, w * (0.22 + 0.78 * Math.pow(Math.abs(Math.sin(i * 0.0025 + ph)), 0.7))]);
      if (depth < 2 && R() < 0.0021) trace(x, y, a + (R() < 0.5 ? -1 : 1) * (0.4 + R() * 0.6), len * (0.15 + R() * 0.3), w * 0.55, col, str * 0.8, depth + 1);
    }
    veins.push({ pts, col, str });
  }
  const grey = '112,110,106', gold = '166,140,100';
  for (let i = 0; i < 4; i++) trace(R() * W, R() * H, -0.7 + R() * 0.5 + (R() < 0.3 ? Math.PI : 0), 1800 + R() * 1800, 1.4 + R() * 1.8, R() < 0.45 ? gold : grey, 1, 0);
  for (let i = 0; i < 10; i++) trace(R() * W, R() * H, -0.9 + R() * 1.2, 300 + R() * 900, 0.5 + R() * 0.8, R() < 0.4 ? gold : grey, 0.6, 1);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const passes = [[10, 0.028, '196,176,142'], [4, 0.06, null], [1.6, 0.17, null]];
  for (const v of veins) for (const [sc, al, hc] of passes) {
    const col = hc || v.col;
    for (let k = 0; k < v.pts.length - 1; k += 12) {
      const seg = v.pts.slice(k, k + 13); if (seg.length < 2) continue;
      const w = seg[Math.floor(seg.length / 2)][2];
      const ox = Math.floor(seg[0][0] / W) * W, oy = Math.floor(seg[0][1] / H) * H;
      wrapDraw(ox, oy, () => {
        g.beginPath(); g.moveTo(seg[0][0], seg[0][1]);
        for (let j = 1; j < seg.length; j++) g.lineTo(seg[j][0], seg[j][1]);
        g.strokeStyle = `rgba(${col},${al * v.str})`; g.lineWidth = Math.max(0.4, w * sc); g.stroke();
      });
    }
  }
  // soften: down-sample 3× and back up (works on every browser, unlike ctx.filter)
  { const [t, tg] = canvas(W / 3, H / 3); tg.imageSmoothingQuality = 'high'; tg.drawImage(c, 0, 0, W / 3, H / 3);
    g.imageSmoothingQuality = 'high'; g.drawImage(t, 0, 0, W, H); }
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 3; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  return toTex(c);
}
// Large light-grey floor tiles (texture = 2 m × 2 m, 1 m tiles)
// Lunaris Perla 120×120 porcelain: light warm-grey, matte, fine white + grey speckle (texture = 2.4 m, 2×2 tiles)
function makeFloor() {
  const S = 2048, T = 1024; const [c, g] = canvas(S, S); const R = rng(7);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const b = 207 + Math.round((R() - 0.5) * 4); g.fillStyle = `rgb(${b},${b - 1},${b - 5})`; g.fillRect(i * T, j * T, T, T);
    g.save(); g.beginPath(); g.rect(i * T, j * T, T, T); g.clip();
    for (let k = 0; k < 40; k++) { const x = i * T + R() * T, y = j * T + R() * T, r = 80 + R() * 300; const gr = g.createRadialGradient(x, y, 0, x, y, r); const cc = R() < .5 ? '188,186,181' : '226,225,221'; gr.addColorStop(0, `rgba(${cc},0.08)`); gr.addColorStop(1, `rgba(${cc},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
    g.restore();
  }
  // speckle: ~1.2 mm per pixel
  for (let k = 0; k < 260000; k++) {
    const x = R() * S, y = R() * S, p = R();
    let col, r;
    if (p < 0.55) { const v = 222 + R() * 18; col = `rgba(${v},${v - 1},${v - 4},${0.5 + R() * 0.5})`; r = 0.6 + R() * 1.6; }
    else if (p < 0.93) { const v = 168 + R() * 22; col = `rgba(${v},${v - 1},${v - 4},${0.35 + R() * 0.45})`; r = 0.5 + R() * 1.2; }
    else { const v = 140 + R() * 20; col = `rgba(${v},${v},${v - 3},0.5)`; r = 0.5 + R() * 0.8; }
    if (R() < 0.04) r *= 2.2;
    g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  }
  const id = g.getImageData(0, 0, S, S), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 6; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  g.fillStyle = 'rgb(176,174,169)';
  for (const p of [0, T]) { g.fillRect(p - 1.5, 0, 3, S); g.fillRect(0, p - 1.5, S, 3); }
  g.fillRect(S - 1.5, 0, 1.5, S); g.fillRect(0, S - 1.5, S, 1.5);
  return toTex(c);
}
function makeWood(base = '#cdbca2', seed = 3) {
  const [c, g] = canvas(512, 512); const R = rng(seed);
  g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 160; i++) {
    const y0 = R() * 512, a = 0.04 + R() * 0.1, dark = R() < 0.6;
    g.strokeStyle = dark ? `rgba(120,96,70,${a})` : `rgba(240,230,212,${a})`; g.lineWidth = 0.6 + R() * 2.5;
    g.beginPath(); for (let x = 0; x <= 512; x += 16) { const y = y0 + Math.sin(x * 0.012 + i) * 3 + Math.sin(x * 0.05 + i * 2) * 0.8; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  }
  return toTex(c);
}
function makeCooktop() {
  const [c, g] = canvas(512, 512);
  g.fillStyle = '#f3f2ee'; g.fillRect(0, 0, 512, 512); // milk-white glass
  g.strokeStyle = 'rgba(110,110,110,0.35)'; g.lineWidth = 2;
  for (const [x, y, r] of [[140, 150, 85], [370, 140, 70], [140, 370, 70], [370, 370, 95]]) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); }
  g.fillStyle = 'rgba(90,90,90,0.4)'; g.fillRect(200, 470, 112, 6);
  return toTex(c);
}
function makeSky() {
  const [c, g] = canvas(16, 256);
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5d7699'); gr.addColorStop(0.25, '#768394'); gr.addColorStop(0.5, '#8a96a3'); gr.addColorStop(1, '#7c7f78');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ---------------- scene helpers ---------------- */
function worldUV(geo, cx, cy, cz, { sx = 3.2, sy = 1.6, ox = 0, oy = 0 } = {}) {

/* ---------------- light probe (bounced light + real reflections) ---------------- */
const pmrem = new THREE.PMREMGenerator(renderer);
const roomEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

cubeCam.position.set(-0.9, 1.35, 1.6); scene.add(cubeCam);
let probe = null;
function bake() {
  renderer.shadowMap.needsUpdate = true;
  scene.environment = roomEnv; scene.environmentIntensity = 0.25;
  for (let i = 0; i < 2; i++) {
    cubeCam.update(renderer, scene);
    const rt = pmrem.fromCubemap(cubeRT.texture);
    if (probe) probe.dispose(); probe = rt;
    scene.environment = rt.texture; scene.environmentIntensity = 0.85;
  }
  renderer.shadowMap.needsUpdate = true;
  dirty = true;
}
let bakeT = null; const rebake = () => { clearTimeout(bakeT); bakeT = setTimeout(bake, 30); };

// every frame is rendered at full quality (AO + MSAA); speed comes from merged geometry and a cheaper AO setup
function draw() { if (aoOn && composer) composer.render(); else renderer.render(scene, camera); }

/* ---------------- camera: stand in the aisle and look around ---------------- */
const AISLE = { y: 1.6, z: 1.18 };

function goView(name) {

const el = renderer.domElement; const ptrs = new Map(); let pinch = null;
const pdist = () => { const a = [...ptrs.values()]; return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1; };

function step(d) { tgt.x -= Math.sin(tgt.yaw) * d; tgt.z -= Math.cos(tgt.yaw) * d; tgt.y = AISLE.y; }

hold($('bl'), () => tgt.yaw += 0.025);
hold($('br'), () => tgt.yaw -= 0.025);
hold($('bu'), () => tgt.pitch = clamp(tgt.pitch + 0.02, -1.35, 1.35));
hold($('bd'), () => tgt.pitch = clamp(tgt.pitch - 0.02, -1.35, 1.35));

function stopAuto() { auto = false; }
$('bgear').addEventListener('click', () => { $('settings').classList.toggle('open'); $('bgear').classList.toggle('on'); });
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
$('exp').addEventListener('input', e => { renderer.toneMappingExposure = parseFloat(e.target.value); dirty = true; });
$('fov').addEventListener('input', e => { tgt.fov = parseFloat(e.target.value); });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight); dirty = true;
  if (vr) stereo.setSize(innerWidth, innerHeight);

// top-down floor plan with camera position + view direction (1 m = 40 px at 2×)
const mapC = $('map'), mg = mapC.getContext('2d');
function drawMap() {
  const MX0 = -4.5, MZ0 = -3.5, s = 20.5, o = 8; const X = x => o + (x - MX0) * s, Z = z => o + (z - MZ0) * s;
  mg.clearRect(0, 0, mapC.width, mapC.height);
  const prect = (x0, y0, x1, y1, f) => { mg.fillStyle = f; const a = X(pX(y0)), b = Z(pZ(x1)); mg.fillRect(a, b, X(pX(y1)) - a, Z(pZ(x0)) - b); };
  BALCONIES.forEach(r => prect(...r, 'rgba(160,160,150,.35)'));
  const rect = (x0, z0, x1, z1, f) => { mg.fillStyle = f; mg.fillRect(X(x0), Z(z0), (x1 - x0) * s, (z1 - z0) * s); };
  rect(-3.988, 0, 1.2 + DX, 0.62, '#e9e6df'); rect(1.2 + DX, 0, 3.523 + DX, 0.7, '#bfbfbf');
  rect(-4, 1.75, -2.0, 2.65, '#e9e6df');
  { const SW = pZ(369.24), SX = (pX(279) + pX(513.2)) / 2 - 0.2, TVW = pX(542.7);                      // living furniture
    rect(SX - 1.3, SW - 1.0, SX + 1.3, SW, '#cfc6b8'); rect(SX - 1.5, SW - 3.2, SX + 1.5, SW - 0.7, 'rgba(185,173,154,.6)');
    mg.fillStyle = '#2f2d2b'; mg.beginPath(); mg.arc(X(1.2), Z(SW - 1.95), 0.5 * s, 0, 6.283); mg.fill();
    rect(TVW - 0.45, pZ(428.28) - 3.23, TVW, pZ(428.28) - 0.3, '#b89470');
    mg.fillStyle = '#6a4a34'; mg.beginPath(); mg.arc(X(-2.75), Z(pZ(482.04) + 0.3), 0.6 * s, 0, 6.283); mg.fill();
    mg.fillStyle = '#e9e3d6'; mg.beginPath(); mg.arc(X(0.70), Z(3.374), 0.44 * s, 0, 6.283); mg.fill(); }
  WALLS.forEach(([x0, y0, x1, y1, ops = []]) => {
    prect(x0, y0, x1, y1, '#f2f2f2');
    const alongX = (x1 - x0) >= (y1 - y0);
    ops.forEach(([a, b, sill, top, k]) => prect(...(alongX ? [a, y0, b, y1] : [x0, a, x1, b]), (sill > 0.1 || k === 'slide' || k === 'win' || k === null) ? '#7fb2e6' : '#c8a46a'));
  });

  mg.lineTo(...dir(cur.yaw + Math.min(h, 1.4))); mg.lineTo(...dir(cur.yaw - Math.min(h, 1.4))); mg.fill();
  mg.fillStyle = '#ffd65a'; mg.beginPath(); mg.arc(cx, cz, 5, 0, 6.283); mg.fill();
}
/* ---------------- VR (phone-in-headset, side-by-side stereo) ---------------- */
const stereo = new StereoEffect(renderer); stereo.setEyeSeparation(0.064);
let vr = false, gyroOK = false, ori = null, calib = null, savedFov = 70, wakeLock = null, exitT = null;
const zee = new THREE.Vector3(0, 0, 1), q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const eul = new THREE.Euler(), gq = new THREE.Quaternion(), q0 = new THREE.Quaternion(), yawFix = new THREE.Quaternion(), fwd = new THREE.Vector3();
const D2R = Math.PI / 180;
const screenAngle = () => (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
function onOri(e) { if (e.alpha == null) return; ori = e; gyroOK = true; }
function gyroQuat() {
  eul.set(ori.beta * D2R, ori.alpha * D2R, -ori.gamma * D2R, 'YXZ');
  gq.setFromEuler(eul); gq.multiply(q1); gq.multiply(q0.setFromAxisAngle(zee, -screenAngle() * D2R));
  return gq;
}
function toast(t, ms = 4000) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms); }
function showExit() { const b = $('vrexit'); b.classList.remove('fade'); clearTimeout(exitT); exitT = setTimeout(() => b.classList.add('fade'), 3000); }
async function enterVR() {
  // iOS asks for motion permission; must start inside the tap
  let perm = Promise.resolve();
  try { if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') perm = DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (e) {}
  try { const fs = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen; if (fs) Promise.resolve(fs.call(document.documentElement)).catch(() => {}); } catch (e) {}
  vr = true; gyroOK = false; calib = null; document.body.classList.add('vr');
  const standalone = navigator.standalone || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  const canFS = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) && !/iPhone/.test(navigator.userAgent);
  if (!standalone && !canFS) setTimeout(() => toast('iPhone Safari keeps its toolbars on web pages. For true full screen: exit VR, tap Share → Add to Home Screen, then open “Kitchen” from your home screen.', 7000), 1700);
  addEventListener('deviceorientation', onOri);
  tour = { i: -1, t0: 0, fly: null }; nextStation();
  savedFov = tgt.fov; tgt.fov = 88; cur.fov = 88; stopAuto();
  stereo.setSize(innerWidth, innerHeight); showExit();
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  await perm;
  setTimeout(() => {
    if (vr && !gyroOK) { auto = true; toast('Head tracking (motion sensor) is blocked in this viewer, so the view turns slowly on its own. Tap the screen to show Exit.', 6000); }
    else if (vr) toast('Look around by turning your head. Tap the screen to re-centre.', 3500);

}
function exitVR() {

$('bvr').addEventListener('click', enterVR);
$('vrexit').addEventListener('click', e => { e.stopPropagation(); exitVR(); });
// in VR: press & hold the screen to walk where you look; a quick tap re-centres and shows Exit
let vrWalk = false, vrT0 = 0;
el.addEventListener('pointerdown', () => { if (!vr) return; vrWalk = true; vrT0 = performance.now(); });
addEventListener('pointerup', () => { if (!vr || !vrWalk) return; vrWalk = false; if (performance.now() - vrT0 < 250) { calib = null; showExit(); } });
const vfwd = new THREE.Vector3();
// VR tour: every 10 s the camera flies (1 s, eased) to the next station; only position changes, head direction stays
const STATIONS = [
  [-3.55, 1.6, 1.15],                                   // espresso machine
  [-1.6, 1.6, 1.05],                                    // sink
  [0.61, 1.6, 1.35],                                    // fridge
  [3.5, 1.6, 0.75],                                     // main entrance
  [0.66, 1.12, 3.374],                                  // sitting in the swivel chair
  [(pX(279) + pX(513.2)) / 2 - 0.2, 1.12, pZ(369.24) - 0.55], // sitting on the sofa
  [-2.75 + 0.51, 1.15, pZ(482.04) + 0.3 + 0.51],        // dining chair nearest the balcony and the sofa
  [pX(77.36) + 0.42, 1.15, pZ(155.64) - 1.75],          // balcony chair next to the grill master
  [-2.28, 1.37, 2.95],                                  // island stool to the right of the schnauzer
];
// what each station looks at when chosen from the buttons (in VR your head decides)
const STATION_LOOK = [
  [-3.785, 1.1, 2.1],       // the Lelit
  [-1.6, 0.9, 0.3],         // into the sink
  [0.61, 1.2, 0.35],        // fridge doors
  [-1.0, 1.2, 3.0],         // across the living room to the kitchen
  [4.04, 1.42, 3.59],       // the TV
  [-1.0, 1.2, 1.0],         // toward the kitchen
  [-2.8, 1.2, 9.2],         // out to the balcony and the grill
  [-2.8, 1.25, 9.2],        // the grill master
  [-1.5, 1.1, 0.3],         // the kitchen counter

function stationView(i) { const p = STATIONS[i]; return { pos: p, ...lookFrom(p, STATION_LOOK[i]) }; }
let tour = null;
function nextStation() { tour.i = (tour.i + 1) % STATIONS.length; tour.fly = { t0: performance.now(), from: [cur.x, cur.y, cur.z], to: STATIONS[tour.i] }; }
function tourTick(now) {
  if (!tour) return;
  if (tour.fly) {
    const k = Math.min(1, (now - tour.fly.t0) / 1000), e = k * k * (3 - 2 * k), f = tour.fly.from, t = tour.fly.to;
    cur.x = tgt.x = f[0] + (t[0] - f[0]) * e; cur.y = tgt.y = f[1] + (t[1] - f[1]) * e; cur.z = tgt.z = f[2] + (t[2] - f[2]) * e;

}
function renderVR() {
  camera.position.set(cur.x, cur.y, cur.z);
  if (camera.fov !== cur.fov) { camera.fov = cur.fov; camera.updateProjectionMatrix(); }
  if (gyroOK && ori) {
    const q = gyroQuat();
    if (calib === null) { fwd.set(0, 0, -1).applyQuaternion(q); calib = cur.yaw - Math.atan2(-fwd.x, -fwd.z); yawFix.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, calib); }
    camera.quaternion.copy(yawFix).multiply(q);

  stereo.render(scene, camera);
}

function tick() {
  requestAnimationFrame(tick);
  if (vr) {
    if (auto) tgt.yaw += 0.0015;
    for (const k of ['x', 'y', 'z', 'yaw', 'pitch', 'fov']) cur[k] += (tgt[k] - cur[k]) * 0.2;
    tourTick(performance.now());
    ANIMS.forEach(f => f(performance.now()));
    if (vrWalk && performance.now() - vrT0 > 250) { vfwd.set(0, 0, -1).applyQuaternion(camera.quaternion); vfwd.y = 0; if (vfwd.lengthSq() > 1e-4) { vfwd.normalize(); cur.x += vfwd.x * 0.025; cur.z += vfwd.z * 0.025; tgt.x = cur.x; tgt.z = cur.z; } }
    renderVR(); return;
  }
  if (auto) tgt.yaw += 0.0025;
  let moving = false;
  for (const k of ['x', 'y', 'z', 'yaw', 'pitch', 'fov']) {
    const d = tgt[k] - cur[k];
    if (Math.abs(d) > 1e-5) { cur[k] += d * 0.2; moving = true; } else cur[k] = tgt[k];
  }
  if (moving) { const f = $('fov'); if (Math.abs(f.value - cur.fov) > 0.5) f.value = Math.round(cur.fov); }
  ANIMS.forEach(f => f(performance.now()));            // dog + grill master animate, so every frame is drawn
  apply(); draw(); if (moving || dirty) drawMap(); dirty = false;
}


/* ---------------- performance: merge all static meshes that share a material into one draw call ---------------- */
function mergeStatic(S) {
  scene.updateMatrixWorld(true);
  const buckets = new Map(), victims = [];
  scene.traverse(o => {
    if (!o.isMesh || Array.isArray(o.material) || o.userData.keep) return;
    for (let p = o.parent; p; p = p.parent) if (p === S.islCer || p === S.islCab) return;
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv || !g.attributes.normal) return;
    g.clearGroups(); g.applyMatrix4(o.matrixWorld);
    const key = o.material.uuid + (o.castShadow ? 'c' : '') + (o.receiveShadow ? 'r' : '');
    if (!buckets.has(key)) buckets.set(key, { mat: o.material, cast: o.castShadow, recv: o.receiveShadow, geos: [] });
    buckets.get(key).geos.push(g); victims.push(o);
  });
  let n = 0;
  for (const b of buckets.values()) {
    const merged = mergeGeometries(b.geos, false); if (!merged) continue;
    const m = new THREE.Mesh(merged, b.mat); m.castShadow = b.cast; m.receiveShadow = b.recv; scene.add(m); n++;
    b.geos.forEach(g => g.dispose());
  }
  victims.forEach(o => { o.parent && o.parent.remove(o); o.geometry.dispose(); });
  console.log(`merged ${victims.length} meshes into ${n}`);
}

/* ---------------- start ---------------- */
(async () => {
  const S = await build();
  $('cSpots').addEventListener('change', e => { const on = e.target.checked; S.spots.forEach(s => s.intensity = on ? 9 : 0); S.M.lamp.emissiveIntensity = on ? 4.5 : 0; rebake(); });
  $('cLed').addEventListener('change', e => { const on = e.target.checked; S.led.intensity = on ? 14 : 0; S.M.led.emissiveIntensity = on ? 5 : 0; rebake(); });
  $('cSun').addEventListener('change', e => { S.sun.intensity = e.target.checked ? 4.5 : 0; rebake(); });
  $('cAO').addEventListener('change', e => { aoOn = e.target.checked; if (aoOn && !composer) makeComposer(); dirty = true; });
  $('islSide').addEventListener('change', e => { const cab = e.target.value === 'cab'; S.islCab.visible = cab; S.islCer.visible = !cab; rebake(); });
  $('loadtxt').textContent = 'Baking light & reflections…'; await nextFrame();
  mergeStatic(S); apply(); bake(); makeComposer();
  goView('counter');
  tick();
  setTimeout(() => $('load').classList.add('hide'), 250);
})();
